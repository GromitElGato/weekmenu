<script>
// Verbinding met de Google Sheet: houdt een kopie in het geheugen, stuurt wijzigingen door
// en haalt om de paar seconden de wijzigingen van de ander op.
(function(){
  const POLL=window.POLL_MS||7000;
  const cache=new Map(),subs=[];
  let lastOk=true,loaded=false,v=null,queue=[],inflight=false,polling=false,fails=0,started=false,offline=false,rt=null,sending=[];
  const clone=o=>JSON.parse(JSON.stringify(o));
  const merge=(a,b)=>{for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])){a[k]=merge(a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])?a[k]:{},b[k])}else a[k]=b[k]}return a};
  const meta={fromCache:false,hasPendingWrites:false};
  // Praat met de Apps Script-API (zie config.js). GET voor lezen, POST (text/plain) voor schrijven.
  // Sleutel: komt uit de link (#k=...) of wordt één keer gevraagd en onthouden op dit toestel.
  const KEYN="weekmenu-key";let asked=false;
  try{const m=/[#&]k=([^&]+)/.exec(location.hash);if(m){localStorage.setItem(KEYN,decodeURIComponent(m[1]));history.replaceState(null,"",location.pathname+location.search)}}catch(e){}
  const getKey=()=>{
    let k="";try{k=localStorage.getItem(KEYN)||""}catch(e){}
    if(!k&&!asked){asked=true;k=(prompt("Geef de sleutel van het weekmenu in:")||"").trim();if(k){try{localStorage.setItem(KEYN,k)}catch(e){}}}
    if(!k)throw new Error("sleutel ontbreekt");
    return k
  };
  const netErr=m=>{const e=new Error(m);e.net=true;return e};
  const run=async(fn,...a)=>{
    const url=window.API_URL;
    if(!url)throw new Error("API_URL ontbreekt in config.js");
    const key=getKey();
    if(navigator.onLine===false)throw netErr("offline");
    const ctl=new AbortController(),tt=setTimeout(()=>ctl.abort(),15000);
    let j;
    try{
      let r;
      if(fn==="api_dump")r=await fetch(url+"?action=dump&wk="+encodeURIComponent(a[0]||"")+"&v="+encodeURIComponent(a[1]||"")+"&key="+encodeURIComponent(key),{signal:ctl.signal});
      else r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"write",key:key,ops:a[0]}),signal:ctl.signal});
      if(!r.ok)throw new Error("HTTP "+r.status);
      j=await r.json()
    }catch(e){
      if(e&&(e.name==="AbortError"||e instanceof TypeError||e instanceof SyntaxError))throw netErr(String(e));
      throw e
    }finally{clearTimeout(tt)}
    if(j&&j.error==="ongeldige sleutel"){try{localStorage.removeItem(KEYN)}catch(e){}asked=false;throw new Error(j.error)}
    if(j&&j.error)throw new Error(j.error);
    return j
  };
  // Offline-opslag: de laatst bekende gegevens en nog niet verstuurde wijzigingen blijven op dit toestel bewaard.
  const DK="weekmenu-data",QK="weekmenu-queue";
  const paint=()=>{try{if(typeof paintStatus==="function")paintStatus()}catch(e){}};
  const save=()=>{
    try{localStorage.setItem(DK,JSON.stringify({v:v,docs:[...cache]}));localStorage.setItem(QK,JSON.stringify(sending.concat(queue)))}catch(e){}
    paint()
  };
  const load=()=>{
    try{
      const d=JSON.parse(localStorage.getItem(DK)||"null");
      if(d&&Array.isArray(d.docs)&&d.docs.length){d.docs.forEach(e=>cache.set(e[0],e[1]));v=d.v||null;loaded=true}
      const q=JSON.parse(localStorage.getItem(QK)||"[]");
      if(Array.isArray(q))queue=q
    }catch(e){}
  };
  const setOffline=x=>{if(offline!==x){offline=x;paint()}};
  const fireNow=()=>{if(loaded)subs.slice().forEach(s=>s())};
  const notify=()=>{try{if(typeof flash==="function")flash("Opslaan in de Google Sheet mislukt. Controleer je verbinding en probeer opnieuw.")}catch(e){}};
  const snapDoc=p=>({id:p.split("/").pop(),exists:cache.has(p),data:()=>cache.has(p)?clone(cache.get(p)):undefined,metadata:meta});
  const inCol=c=>[...cache.keys()].filter(k=>k.startsWith(c+"/")&&k.slice(c.length+1).indexOf("/")<0).sort();
  const unsub=f=>()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)};
  async function poll(){
    if(polling||inflight||queue.length)return;
    polling=true;
    try{
      const r=await run("api_dump",typeof wk!=="undefined"?wk:"",v);lastOk=true;setOffline(false);
      if(!inflight&&!queue.length){
        if(r.same){v=r.v;if(!loaded){loaded=true;fireNow()}}
        else{
          const m=new Map(Object.entries(r.docs)),changed=!loaded||JSON.stringify([...m])!==JSON.stringify([...cache]);
          cache.clear();m.forEach((x,k)=>cache.set(k,x));v=r.v;loaded=true;if(changed)fireNow()
        }
        save()
      }
    }catch(e){lastOk=false;if(e&&e.net)setOffline(true)}
    polling=false
  }
  async function flush(){
    if(inflight||!queue.length)return;
    clearTimeout(rt);
    inflight=true;let ok=true,net=false,dropped=false;
    const ops=queue.splice(0);sending=ops;
    try{await run("api_write",ops);fails=0;setOffline(false)}
    catch(e){
      ok=false;
      if(e&&e.net){queue=ops.concat(queue);net=true;setOffline(true)}
      else{fails++;if(fails<3)queue=ops.concat(queue);else{fails=0;v=null;dropped=true;notify()}}
    }
    sending=[];inflight=false;save();
    if(net)rt=setTimeout(flush,20000);
    else if(!ok&&queue.length)setTimeout(flush,2000);
    else if(queue.length)flush();
    else if(dropped)poll()
  }
  const sched=()=>setTimeout(flush,250);
  const docRef=p=>({id:p.split("/").pop(),path:p,
    get:async()=>snapDoc(p),
    set:async d=>{cache.set(p,clone(d));queue.push({op:"set",path:p,data:clone(d)});save();sched();fireNow()},
    update:async d=>{if(!cache.has(p)){const e=new Error("bestaat niet");e.code="invalid_argument";throw e}
      cache.set(p,merge(clone(cache.get(p)),clone(d)));queue.push({op:"update",path:p,data:clone(d)});save();sched();fireNow()},
    delete:async()=>{cache.delete(p);queue.push({op:"delete",path:p});save();sched();fireNow()},
    onSnapshot:n=>{const f=()=>n(snapDoc(p));subs.push(f);if(loaded)setTimeout(f,0);return unsub(f)},
    collection:c=>colRef(p+"/"+c)});
  const colRef=c=>({path:c,doc:id=>docRef(c+"/"+(id||Math.random().toString(36).slice(2))),
    onSnapshot:n=>{const f=()=>{const docs=inCol(c).map(snapDoc);n({docs,size:docs.length,empty:!docs.length,metadata:meta})};subs.push(f);if(loaded)setTimeout(f,0);return unsub(f)}});
  // Eén keer laden bij het openen; daarna haal je wijzigingen van de ander alleen op via de sync-knop.
  function start(){
    if(started)return;started=true;load();
    (queue.length?flush():Promise.resolve()).then(poll);
    window.addEventListener("online",()=>{if(queue.length)flush()});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden&&queue.length)flush()})
  }
  window.claude={info:()=>({offline:offline,pending:sending.length+queue.length}),refresh:async()=>{
    const wait=async()=>{let t=0;while((polling||inflight)&&t++<80)await new Promise(r=>setTimeout(r,250))};
    v=null;await wait();
    if(queue.length){await flush();await wait()}
    if(queue.length)throw new Error("offline");
    await poll();if(!lastOk)throw new Error("mislukt")},use:async n=>{if(n==="db"){start();return{doc:docRef,collection:colRef}}return null}};
})();
</script>

<script>
const D=["Vrijdag","Zaterdag","Zondag","Maandag","Dinsdag","Woensdag","Donderdag"];
const EXTRA=["kippenwit","chips","chocolade","fruitkoeken","pasta allerlei","olie","eieren","bananen","kiwi’s","appels","boter","brood","fruitsap","bonen in tomatensaus","couscous","pistolets/ovenbroodjes"];
// eenheden → basiseenheid + factor
const BASE={g:["g",1],gr:["g",1],gram:["g",1],kg:["g",1000],ml:["ml",1],cl:["ml",10],dl:["ml",100],l:["ml",1000],el:["el",1],tl:["tl",1]};
const AL={eieren:"ei",ajuinen:"ajuin",tomaten:"tomaat",courgettes:"courgette",sjalotten:"sjalot",wortels:"wortelen"};
const PL={ei:"eieren",ajuin:"ajuinen",tomaat:"tomaten",courgette:"courgettes",sjalot:"sjalotten"};
const SOEP=false; // soep voorlopig uitgeschakeld: zet op true om terug te krijgen
const ZELF="Vul zelf iets in";

// ---- gedeelde staat -------------------------------------------------------
// Database: recipes/<id> (gedeeld door alle weken), weeks/<vrijdag> met subcollecties items en titles.
let tab="menu",L=[],LS=[];
let db=null,ro=false,failed="",msg="",slow=false,pend=0,chain=Promise.resolve(),deferred=false,showCopy="";
let wref=null,recCol=null,itemsCol=null,titlesCol=null,tm=null,tR=null;
let pendT=null,pendR=null,openR=null,draft=null,drag=null;
const ready={week:false,rec:false},conf={week:false,rec:false};
const RAW={week:null,recipes:[],items:[],titles:[]};
const S={recipes:[],menu:{},inc:{},done:{},soep:{n:"",i:""},ov:{},own:{},order:{},custom:[],titles:[]};

// Menuweek loopt van vrijdag t.e.m. donderdag; op donderdag springt hij naar de komende vrijdag
const wstart=(()=>{const d=new Date();d.setHours(12,0,0,0);const w=d.getDay();d.setDate(d.getDate()+(w===4?1:-((w-5+7)%7)));return d})();
const dl=i=>{const d=new Date(wstart);d.setDate(d.getDate()+i);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()};
const xs=(t,i)=>t.replace(/\btot x\b/gi,"tot "+dl(i).slice(0,5));
const wk=wstart.toISOString().slice(0,10);

const rec=n=>S.recipes.find(r=>r.n===n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num2=x=>String(+x.toFixed(2)).replace(".",",");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const byName=(a,b)=>(a.n||"").localeCompare(b.n||"","nl",{sensitivity:"base"});
// sleutels van vinkjes en aangepaste regels veilig maken als veldnaam in de database

function refresh(){

  const typing=!!(a&&a!==document.body&&v&&v.contains(a)&&((/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&a.type!=="checkbox")||a.isContentEditable));

// Schrijfacties één voor één; zolang er iets onderweg is, blijft je eigen scherm leidend
function qw(fn){
  pend++;
  chain=chain.then(async()=>{
    try{await fn()}
    catch(e){
      if(e&&e.code==="unavailable"){try{await sleep(400+Math.random()*600);await fn();return}catch(e2){e=e2}}
      flash("Opslaan mislukt. Probeer opnieuw; blijft het mislukken, dan heb je mogelijk alleen leesrechten.")
    }
  }).then(()=>{pend--;if(!pend){apply();refresh()}})
}
function wput(patch){qw(async()=>{
  try{await wref.update(patch);return}catch(e){if(!(e&&e.code==="invalid_argument"))throw e}
  await wref.set(Object.assign({wk},patch))
})}

// ---- boodschappenlijst berekenen -----------------------------------------
function parse(it){
  it=it.trim().replace("±","");if(!it)return null;
  let n=it,q="";
  if(it.includes(":")){[n,q]=it.split(":").map(s=>s.trim())}
  else{const m=it.match(/^([\d.,]+)\s*(kg|gr|g|ml|cl|dl|l)?\s+(.+)$/i);if(m){q=m[1]+(m[2]||"");n=m[3]}}
  let t=1,u="";const x=q.match(/^([\d.,]+)\s*([a-z]*)/i);
  if(x){t=parseFloat(x[1].replace(",","."))||1;const w=x[2].toLowerCase();if(BASE[w]){t*=BASE[w][1];u=BASE[w][0]}}
  n=n.toLowerCase().trim();return{n:AL[n]||n,u,t}
}
function fmt(o){
  let{n,u,t}=o;
  if(u==="g"&&t>=1000){t/=1000;u="kg"}
  else if(u==="ml"&&t>=1000){t/=1000;u="l"}
  if(u)return`${num2(t)} ${u} ${n}`;
  if(t===1)return n;
  return`${num2(t)} ${PL[n]||n}`
}
function ings(soup){
  const m=new Map();
  (soup?["Soep"]:D).forEach((d,di)=>{
    if(S.inc[d]===false||S.menu[d]==="Bestellen")return;
    const r=d==="Soep"?S.soep:rec(S.menu[d]);
    const txt=[r&&r.i&&(d==="Soep"?r.i:xs(r.i,di))].filter(Boolean).join(",");if(!txt)return;
    txt.split(",").forEach(it=>{const p=parse(it);if(!p)return;
      const k=p.n+"|"+p.u,o=m.get(k);if(o)o.t+=p.t;else m.set(k,p)})});
  return[...m.entries()].map(([k,o])=>({k,t:fmt(o)})).sort((a,b)=>a.t.localeCompare(b.t,"nl"))
}
function listSecs(){
  const f=(id,a)=>ordr(id,a).filter(x=>!isDone(x[0])).map(x=>x[1]);
  const cu=s=>S.custom.filter(o=>o.s===s).map(o=>["c:"+o.id,o.t]);
  const r=[{h:"TE KOPEN",i:f("main",L.map(o=>["l:"+o.k,ot("l:"+o.k,o.t)]).concat(cu("main")))}];
  if(LS.length)r.push({h:S.soep.n?S.soep.n.toUpperCase():"SOEP",i:f("soep",LS.map(o=>["s:"+o.k,ot("s:"+o.k,o.t)]))});
  r.push({h:"NA TE KIJKEN",i:f("extra",EXTRA.map(x=>["e:"+x,ot("e:"+x,x)]))});
  S.titles.forEach(T=>r.push({h:T.t.toUpperCase(),i:f(T.id,cu(T.id))}));
  return r.filter(x=>x.i.length)
}
function listText(){return listSecs().map(s=>s.h+"\n"+s.i.map(x=>"• "+x).join("\n")).join("\n\n")}
function listHtml(){return listSecs().map(s=>`<div><b><u>${esc(s.h)}</u></b></div>`+s.i.map(x=>`<div>• ${esc(x)}</div>`).join("")).join("<div><br></div>")}

const iso=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
function nextMonday(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+((1-d.getDay()+7)%7||7));return d}
const dn=d=>S.menu[d]===ZELF?(S.own[d]||""):(S.menu[d]||"");

  const s=nextMonday(),e=new Date(s);e.setDate(e.getDate()+1);
  const txt=D.map((d,i)=>`${["VR","ZA","ZO","MA","DI","WO","DO"][i]} ${dn(d)}`.trim()).concat(SOEP&&S.soep.n?["SOEP "+S.soep.n]:[]).join("\n");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("MENU")+
    "&dates="+iso(s)+"/"+iso(e)+"&details="+encodeURIComponent(txt)
}
async function toKeep(b){
  const tx=listText(),h=listHtml(),ok=()=>{};
  try{
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([h],{type:"text/html"}),"text/plain":new Blob([tx],{type:"text/plain"})})]);return ok()}
  }catch(e){}
  try{ // rich fallback
    const d=document.createElement("div");d.contentEditable="true";d.style.cssText="position:fixed;left:-9999px;top:0";d.innerHTML=h;document.body.appendChild(d);
    const g=window.getSelection(),r=document.createRange();r.selectNodeContents(d);g.removeAllRanges();g.addRange(r);
    const y=document.execCommand("copy");g.removeAllRanges();d.remove();if(y)return ok()
  }catch(e){}
  try{await navigator.clipboard.writeText(tx);ok()}catch(e){showCopy=tx;render()}
}

  if(e.clientY>innerHeight-90)scrollBy(0,14);else if(e.clientY<90)scrollBy(0,-14);
  const el=document.elementFromPoint(e.clientX,e.clientY),o=el&&el.closest(".row");

      sec("main",L.map(o=>["l:"+o.k,row(o.t,"l:"+o.k)]).concat(itemRows("main",row)))+addRow("main")+
      (LS.length?`<h2>${S.soep.n?esc(S.soep.n.toUpperCase()):"SOEP"}</h2>`+sec("soep",LS.map(o=>["s:"+o.k,row(o.t,"s:"+o.k)])):"")+
      `<h2>NA TE KIJKEN</h2>`+sec("extra",EXTRA.map(t=>["e:"+t,row(t,"e:"+t)]))+customHtml(row)+`<div style="margin:26px 0 0"><button class="cat" onclick="addT()">VOEG EEN CATEGORIE TOE</button><div style="display:flex;gap:8px;margin:10px 0 0"><input type="text" id="ct" placeholder="soep, mealprep..." style="margin:0;font-size:15px;padding:10px" onkeydown="if(event.key==='Enter')addT()"><button class="btn" style="margin:0;padding:10px 14px" onclick="addT()">+</button></div></div>`;
  }else{
    const rows=S.recipes.filter(r=>r.n&&r.n!=="Bestellen").sort(byName);
    v.innerHTML=`<div class="card recs">`+(rows.length?rows.map(r=>{const o=openR===r.id;
      return`<div class="rr"><button class="rh ${o?"o":""}" data-ro-ok onclick="openR=${o?"null":`'${r.id}'`};render()"><span class="rn">${esc(r.n)}</span>${r.off?`<span class="tg">niet in keuzelijst</span>`:""}<span class="ch"></span></button>`+(o?`<div class="rb">
        <div class="lb">Ingrediënten</div><ul class="ing" style="margin:0;padding-left:20px">${ulHtml(r)}</ul>
        <label class="inc" style="justify-content:flex-start;text-align:left;margin-top:14px"><input type="checkbox" id="off-${r.id}" ${r.off?"":"checked"} onchange="setOff('${r.id}',!this.checked)">Toon in keuzelijst van weekmenu</label>
        ${r.seed?"":`<button class="lnk" onclick="delR('${r.id}')">${pendR===r.id?"Zeker? Tik nogmaals":"Recept verwijderen"}</button>`}</div>`:"")+`</div>`}).join(""):`<p class="ing">Nog geen recepten.</p>`)+`</div>`+
    (draft?`<div class="card" id="nd" style="margin-top:14px"><div class="rb" style="padding:0"><div class="lb" style="font-size:15px;color:var(--tx)">Nieuw recept</div><input type="text" id="rn" placeholder="Naam van het gerecht" value="${esc(draft.n)}" onchange="draft.n=this.value"><div class="lb">Ingrediënten</div><ul class="ing" id="dl" style="margin:0;padding-left:20px">${dHtml()}</ul><button class="btn" style="margin:8px 0 0;padding:8px 14px;font-size:14px" onclick="dAdd()">+ Ingrediënt</button><div style="margin-top:16px"><button class="btn" style="margin:0 10px 0 0" onclick="dSave()">Bewaar recept</button><button class="lnk" style="display:inline;padding:0" onclick="cancelR()">Annuleren</button></div></div></div>`:`<button class="btn" style="margin-top:4px" onclick="addR()">+ Nieuw recept</button>`);
  }
  if(ro)lock()
}

// ---- verbinden met de gedeelde database --------------------------------------
function onErr(e){
  if(e&&e.code==="revoked"){failed="Je toegang is ingetrokken. Open de link opnieuw of vraag opnieuw toegang.";render()}
  else flash("De verbinding is verstoord, de pagina probeert het opnieuw.")
}
function got(k,snap){
  if(k in ready){ready[k]=true;if(!snap.metadata.fromCache)conf[k]=true}
  if(conf.week&&conf.rec)slow=false;
  if(!pend)apply();
  refresh()
}
const plain=d=>JSON.parse(JSON.stringify(d.data()));
async function start(){
  const cl=window.claude;
  try{db=cl&&cl.use?await cl.use("db"):null}catch(e){db=null}
  if(!db||!window.API_URL){failed="Er is nog geen API-adres ingesteld. Zet de Web-app-URL van Apps Script in config.js.";render();return}
  try{const u=await cl.use("user");if(u){const c=await u.can("data.write");ro=c===false}}catch(e){}
  wref=db.doc("weeks/"+wk);recCol=db.collection("recipes");
  itemsCol=wref.collection("items");titlesCol=wref.collection("titles");
  wref.onSnapshot(s=>{RAW.week=s.exists?plain(s):null;got("week",s)},onErr);
  recCol.onSnapshot(q=>{RAW.recipes=q.docs.map(d=>({id:d.id,...plain(d)}));got("rec",q)},onErr);
  itemsCol.onSnapshot(q=>{RAW.items=q.docs.map(d=>({id:d.id,...plain(d)}));got("items",q)},onErr);
  titlesCol.onSnapshot(q=>{RAW.titles=q.docs.map(d=>({id:d.id,...plain(d)}));got("titles",q)},onErr);
  setTimeout(()=>{if(!(conf.week&&conf.rec)){slow=true;refresh()}},10000)
}
render();
start();
if("serviceWorker" in navigator)window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
</script>
